<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleNest — Fashion Store</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f7f7f8;color:#171717}
header{background:#111;color:#fff;padding:16px;position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:25px;font-weight:800}
.cart{background:#fff;color:#111;border:0;border-radius:20px;padding:8px 13px;font-weight:700}
.search{margin-top:14px;width:100%;padding:12px 15px;border:0;border-radius:12px;font-size:15px}
.hero{margin:16px;background:#111;color:#fff;border-radius:20px;padding:28px 20px}
.hero h1{font-size:30px;line-height:1.1;margin-bottom:10px}
.hero p{color:#ddd;margin-bottom:18px}
.btn{display:inline-block;background:#fff;color:#111;padding:11px 17px;border-radius:10px;text-decoration:none;font-weight:700}
section{padding:8px 16px 18px}
h2{font-size:21px;margin-bottom:13px}
.categories{display:flex;gap:10px;overflow:auto}
.cat{min-width:95px;background:#fff;border-radius:14px;padding:15px 10px;text-align:center;font-weight:700;box-shadow:0 2px 8px #0000000d}
.cat span{display:block;font-size:27px;margin-bottom:6px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 8px #0000000d}
.pic{height:170px;background:linear-gradient(135deg,#ddd,#f5f5f5);display:flex;align-items:center;justify-content:center;font-size:55px}
.info{padding:12px}
.name{font-weight:700;margin-bottom:6px}
.price{font-size:18px;font-weight:800}
.old{font-size:13px;color:#888;text-decoration:line-through;margin-left:5px}
.add{width:100%;margin-top:10px;padding:10px;border:0;border-radius:9px;background:#111;color:#fff;font-weight:700}
footer{text-align:center;padding:25px 15px;color:#777;font-size:13px}
@media(min-width:700px){.products{grid-template-columns:repeat(4,1fr)}.hero{max-width:1000px;margin:20px auto}.hero h1{font-size:42px}section{max-width:1000px;margin:auto}}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="logo">StyleNest</div>
    <button class="cart" onclick="showCart()">🛒 Cart (<span id="count">0</span>)</button>
  </div>
  <input id="search" class="search" placeholder="Search clothes..." oninput="filterProducts()">
</header>

<div class="hero">
  <h1>Style that feels like you.</h1>
  <p>Discover fresh fashion for every day.</p>
  <a class="btn" href="#products">Shop Now →</a>
</div>

<section>
  <h2>Categories</h2>
  <div class="categories">
    <div class="cat"><span>👕</span>Men</div>
    <div class="cat"><span>👗</span>Women</div>
    <div class="cat"><span>🧒</span>Kids</div>
    <div class="cat"><span>🔥</span>New</div>
  </div>
</section>

<section id="products">
  <h2>Trending Products</h2>
  <div class="products" id="productGrid">
    <div class="card" data-name="Classic T-Shirt">
      <div class="pic">👕</div>
      <div class="info"><div class="name">Classic T-Shirt</div><div class="price">₹499 <span class="old">₹699</span></div><button class="add" onclick="addCart()">Add to Cart</button></div>
    </div>
    <div class="card" data-name="Oversized Hoodie">
      <div class="pic">🧥</div>
      <div class="info"><div class="name">Oversized Hoodie</div><div class="price">₹899 <span class="old">₹1,199</span></div><button class="add" onclick="addCart()">Add to Cart</button></div>
    </div>
    <div class="card" data-name="Denim Jacket">
      <div class="pic">🧥</div>
      <div class="info"><div class="name">Denim Jacket</div><div class="price">₹1,299 <span class="old">₹1,699</span></div><button class="add" onclick="addCart()">Add to Cart</button></div>
    </div>
    <div class="card" data-name="Casual Dress">
      <div class="pic">👗</div>
      <div class="info"><div class="name">Casual Dress</div><div class="price">₹799 <span class="old">₹999</span></div><button class="add" onclick="addCart()">Add to Cart</button></div>
    </div>
  </div>
</section>

<footer>© 2026 StyleNest · Fashion for everyone</footer>

<script>
let cart=0;
function addCart(){cart++;document.getElementById('count').textContent=cart}
function showCart(){alert(cart ? `You have ${cart} item(s) in your cart.` : 'Your cart is empty.')}
function filterProducts(){
  const q=document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display=c.dataset.name.toLowerCase().includes(q)?'block':'none';
  });
}
</script>
</body>
</html>
