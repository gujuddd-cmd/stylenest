<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleNest - Men, Women & Kids Fashion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f6f6f6;color:#171717}
header{background:#111;color:#fff;padding:14px 18px;position:sticky;top:0;z-index:10}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:25px;font-weight:800}
.cart{background:#fff;color:#111;border:0;border-radius:22px;padding:10px 15px;font-weight:700}
.search{margin-top:12px;width:100%;padding:13px 15px;border:0;border-radius:12px;font-size:16px}
.hero{margin:18px;background:#111;color:#fff;border-radius:22px;padding:28px 24px}
.hero h1{font-size:30px;margin-bottom:10px}.hero p{color:#ddd;margin-bottom:18px}
.btn{background:#fff;color:#111;border:0;border-radius:12px;padding:12px 18px;font-weight:700}
section{padding:8px 18px 18px}h2{font-size:22px;margin-bottom:14px}
.categories{display:flex;gap:10px;overflow:auto}
.cat{min-width:95px;background:#fff;border:0;border-radius:14px;padding:15px;text-align:center;font-weight:700;box-shadow:0 2px 8px #ddd}
.cat span{display:block;font-size:28px;margin-bottom:6px}
.cat.active{background:#111;color:#fff}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 8px #ddd}
.pic{width:100%;height:190px;object-fit:cover;background:#eee}
.info{padding:12px}.name{font-weight:700;margin-bottom:7px}.price{font-size:18px;font-weight:800}
.old{font-size:13px;color:#888;text-decoration:line-through;margin-left:6px}
.tag{font-size:11px;background:#eee;border-radius:7px;padding:4px 7px;display:inline-block;margin-bottom:7px}
.add{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:700}
footer{text-align:center;padding:25px 15px;color:#777;font-size:13px}
@media(min-width:700px){.products{grid-template-columns:repeat(4,1fr)}.hero{max-width:900px;margin:18px auto}section{max-width:1000px;margin:auto}}
</style>
</head>
<body>
<header>
<div class="top"><div class="logo">StyleNest</div><button class="cart">🛒 Cart (<span id="count">0</span>)</button></div>
<input class="search" id="search" placeholder="Search clothes..." oninput="searchProducts()">
</header>

<div class="hero"><h1>Style that feels like you.</h1><p>Fashion for Men, Women & Kids.</p><button class="btn" onclick="document.getElementById('shop').scrollIntoView()">Shop Now →</button></div>

<section>
<h2>Shop by Category</h2>
<div class="categories">
<button class="cat active" data-cat="All" onclick="setCategory('All',this)">🛍️<span>All</span></button>
<button class="cat" data-cat="Men" onclick="setCategory('Men',this)">👕<span>Men</span></button>
<button class="cat" data-cat="Women" onclick="setCategory('Women',this)">👗<span>Women</span></button>
<button class="cat" data-cat="Kids" onclick="setCategory('Kids',this)">🧒<span>Kids</span></button>
</div>
</section>

<section id="shop"><h2 id="title">All Products</h2><div class="products" id="products"></div></section>
<footer>© 2026 StyleNest • Fashion for everyone</footer>

<script>
const products=[
{name:"Classic T-Shirt",cat:"Men",price:499,old:699,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80"},
{name:"Casual Shirt",cat:"Men",price:799,old:999,img:"https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=800&q=80"},
{name:"Denim Jeans",cat:"Men",price:1199,old:1499,img:"https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=800&q=80"},
{name:"Everyday Hoodie",cat:"Men",price:899,old:1199,img:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=800&q=80"},
{name:"Everyday Top",cat:"Women",price:599,old:799,img:"https://images.unsplash.com/photo-1564257577054-8c4b5f3d0e9b?auto=format&fit=crop&w=800&q=80"},
{name:"Elegant Kurti",cat:"Women",price:899,old:1199,img:"https://images.unsplash.com/photo-1583391733956-6c78276477e6?auto=format&fit=crop&w=800&q=80"},
{name:"Slim Fit Jeans",cat:"Women",price:1099,old:1399,img:"https://images.unsplash.com/photo-1584370848010-d7fe6bc767ec?auto=format&fit=crop&w=800&q=80"},
{name:"Casual Dress",cat:"Women",price:999,old:1299,img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=800&q=80"},
{name:"Kids T-Shirt",cat:"Kids",price:399,old:549,img:"https://images.unsplash.com/photo-1503919545889-aef636e10ad4?auto=format&fit=crop&w=800&q=80"},
{name:"Kids Hoodie",cat:"Kids",price:699,old:899,img:"https://images.unsplash.com/photo-1519238263530-99bdd11df2ea?auto=format&fit=crop&w=800&q=80"},
{name:"Kids Dress",cat:"Kids",price:649,old:849,img:"https://images.unsplash.com/photo-1518831959646-742c3a14ebf7?auto=format&fit=crop&w=800&q=80"},
{name:"Kids Jacket",cat:"Kids",price:799,old:999,img:"https://images.unsplash.com/photo-1519457431-44ccd64a579b?auto=format&fit=crop&w=800&q=80"}
];
let category="All";
function render(list){
document.getElementById("products").innerHTML=list.map(p=>`
<div class="card"><img class="pic" src="${p.img}" alt="${p.name}">
<div class="info"><span class="tag">${p.cat}</span><div class="name">${p.name}</div>
<div class="price">₹${p.price}<span class="old">₹${p.old}</span></div>
<button class="add" onclick="addCart()">Add to Cart</button></div></div>`).join("");
}
function setCategory(cat,el){
category=cat;
document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));el.classList.add("active");
document.getElementById("title").textContent=cat==="All"?"All Products":cat+" Collection";
filter();
document.getElementById("shop").scrollIntoView({behavior:"smooth"});
}
function filter(){
const q=document.getElementById("search").value.toLowerCase();
render(products.filter(p=>(category==="All"||p.cat===category)&&p.name.toLowerCase().includes(q)));
}
function searchProducts(){filter()}
function addCart(){let n=Number(document.getElementById("count").textContent)+1;document.getElementById("count").textContent=n;alert("Product added to cart!")}
render(products);
</script>
</body>
</html>
