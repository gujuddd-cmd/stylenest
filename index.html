<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleNest - Men, Women & Kids Fashion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f5;color:#171717}
header{background:#111;color:#fff;padding:14px 18px;position:sticky;top:0;z-index:10}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:800}
.cart{background:#fff;color:#111;border:0;border-radius:22px;padding:10px 15px;font-weight:700}
.search{margin-top:12px;width:100%;padding:13px 15px;border:0;border-radius:14px;font-size:16px}
.hero{margin:18px;background:#111;color:#fff;border-radius:22px;padding:34px 30px}
.hero h1{font-size:30px;margin-bottom:10px}.hero p{color:#ddd;margin-bottom:20px;font-size:18px}
.btn{background:#fff;color:#111;border:0;border-radius:12px;padding:12px 18px;font-weight:700}
section{padding:8px 18px 20px}
h2{margin:10px 0 16px}
.categories{display:flex;gap:10px;overflow:auto}
.cat{min-width:95px;background:#fff;border:0;border-radius:14px;padding:12px 10px;font-weight:700;font-size:17px}
.cat span{display:block;font-size:28px;margin-bottom:5px}.cat.active{background:#111;color:#fff}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 8px #ddd}
.pic{width:100%;height:190px;object-fit:cover;background:#eee}
.info{padding:12px}.name{font-weight:700;margin-bottom:7px}.price{font-size:18px;font-weight:800}.old{font-size:13px;color:#888;text-decoration:line-through;margin-left:6px}
.tag{display:inline-block;font-size:11px;background:#eee;border-radius:7px;padding:5px 8px;margin-bottom:8px}
.add{width:100%;margin-top:10px;padding:11px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:700}
footer{text-align:center;padding:25px;color:#777}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30}
.modal-box{background:#fff;width:94%;max-width:520px;max-height:90vh;overflow:auto;margin:5vh auto;border-radius:18px;padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.close{border:0;background:#eee;border-radius:50%;width:36px;height:36px;font-size:20px}
.cart-item{display:flex;gap:10px;border-bottom:1px solid #ddd;padding:12px 0}
.cart-item img{width:70px;height:70px;object-fit:cover;border-radius:10px}
.item-main{flex:1}.qty{display:flex;align-items:center;gap:8px;margin-top:8px}
.qty button{width:30px;height:30px;border:0;border-radius:8px;background:#111;color:#fff}
.total{font-size:20px;font-weight:800;text-align:right;padding:15px 0}
.form input,.form textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:10px;font-size:15px}
.checkout{width:100%;padding:13px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:700;margin-top:8px}
.empty{text-align:center;padding:30px;color:#777}
@media(min-width:700px){.products{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<div class="top"><div class="logo">StyleNest</div><button class="cart" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button></div>
<input class="search" id="search" placeholder="Search clothes..." oninput="filter()">
</header>

<div class="hero"><h1>Style that feels like you.</h1><p>Fashion for Men, Women & Kids.</p><button class="btn" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">Shop Now →</button></div>

<section id="shop">
<h2>Shop by Category</h2>
<div class="categories">
<button class="cat active" onclick="setCategory('All',this)">🛍️<span>All</span></button>
<button class="cat" onclick="setCategory('Men',this)">👕<span>Men</span></button>
<button class="cat" onclick="setCategory('Women',this)">👗<span>Women</span></button>
<button class="cat" onclick="setCategory('Kids',this)">👦<span>Kids</span></button>
</div>
<h2 id="title" style="margin-top:28px">All Products</h2>
<div class="products" id="products"></div>
</section>
<footer>© 2026 StyleNest • Fashion for everyone</footer>

<div class="modal" id="cartModal">
<div class="modal-box">
<div class="modal-head"><h2>Your Cart</h2><button class="close" onclick="closeCart()">×</button></div>
<div id="cartItems"></div>
<div class="total">Total: ₹<span id="total">0</span></div>
<div class="form">
<h3>Checkout Details</h3>
<input id="custName" placeholder="Your Name">
<input id="custPhone" placeholder="Phone Number" inputmode="tel">
<textarea id="custAddress" rows="3" placeholder="Delivery Address"></textarea>
<button class="checkout" onclick="placeOrder()">Place Order</button>
</div>
</div>
</div>

<script>
const products=[
{name:"Classic T-Shirt",cat:"Men",price:499,old:699,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80"},
{name:"Casual Shirt",cat:"Men",price:799,old:999,img:"https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=800&q=80"},
{name:"Denim Jeans",cat:"Men",price:1199,old:1499,img:"https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=800&q=80"},
{name:"Everyday Hoodie",cat:"Men",price:899,old:1199,img:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=800&q=80"},
{name:"Everyday Top",cat:"Women",price:599,old:799,img:"https://images.unsplash.com/photo-1564257577054-8c4b5f3d0e9b?auto=format&fit=crop&w=800&q=80"},
{name:"Elegant Kurti",cat:"Women",price:899,old:1199,img:"https://images.unsplash.com/photo-1583391733956-6c78276477e6?auto=format&fit=crop&w=800&q=80"},
{name:"Slim Fit Jeans",cat:"Women",price:1099,old:1399,img:"https://images.unsplash.com/photo-1584370848010-d7fe6bc767ec?auto=format&fit=crop&w=800&q=80"},
{name:"Casual Dress",cat:"Women",price:999,old:1299,img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=800&q=80"},
{name:"Kids T-Shirt",cat:"Kids",price:399,old:549,img:"https://images.unsplash.com/photo-1503919545889-aef636e10ad4?auto=format&fit=crop&w=800&q=80"},
{name:"Kids Hoodie",cat:"Kids",price:699,old:899,img:"https://images.unsplash.com/photo-1519238263530-99bdd11df2ea?auto=format&fit=crop&w=800&q=80"},
{name:"Kids Dress",cat:"Kids",price:649,old:849,img:"https://images.unsplash.com/photo-1518831959646-742c3a14ebf7?auto=format&fit=crop&w=800&q=80"},
{name:"Kids Jacket",cat:"Kids",price:799,old:999,img:"https://images.unsplash.com/photo-1519457431-44ccd64a579b?auto=format&fit=crop&w=800&q=80"}
];
let category="All",cart=[];

function render(list){
 const box=document.getElementById("products");
 box.innerHTML=list.length?list.map((p,i)=>`<div class="card"><img class="pic" src="${p.img}" alt="${p.name}"><div class="info"><span class="tag">${p.cat}</span><div class="name">${p.name}</div><div class="price">₹${p.price}<span class="old">₹${p.old}</span></div><button class="add" onclick="addCart(${products.indexOf(p)})">Add to Cart</button></div></div>`).join(""):'<div class="empty">No products found.</div>';
}
function setCategory(cat,el){
 category=cat;
 document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));el.classList.add("active");
 document.getElementById("title").textContent=cat==="All"?"All Products":cat+" Collection";
 filter();
}
function filter(){
 const q=document.getElementById("search").value.toLowerCase();
 render(products.filter(p=>(category==="All"||p.cat===category)&&p.name.toLowerCase().includes(q)));
}
function addCart(i){
 const found=cart.find(x=>x.i===i);
 if(found)found.qty++;else cart.push({i,qty:1});
 updateCart(); alert(products[i].name+" added to cart!");
}
function updateCart(){
 document.getElementById("count").textContent=cart.reduce((s,x)=>s+x.qty,0);
 const box=document.getElementById("cartItems");
 if(!cart.length){box.innerHTML='<div class="empty">Your cart is empty.</div>';document.getElementById("total").textContent="0";return;}
 let total=0;
 box.innerHTML=cart.map((x,n)=>{let p=products[x.i];total+=p.price*x.qty;return `<div class="cart-item"><img src="${p.img}"><div class="item-main"><b>${p.name}</b><div>₹${p.price} × ${x.qty}</div><div class="qty"><button onclick="changeQty(${n},-1)">−</button><b>${x.qty}</b><button onclick="changeQty(${n},1)">+</button><button onclick="removeItem(${n})" style="margin-left:8px;background:#ddd;color:#111">Remove</button></div></div></div>`}).join("");
 document.getElementById("total").textContent=total;
}
function changeQty(n,d){cart[n].qty+=d;if(cart[n].qty<=0)cart.splice(n,1);updateCart();}
function removeItem(n){cart.splice(n,1);updateCart();}
function openCart(){updateCart();document.getElementById("cartModal").style.display="block";}
function closeCart(){document.getElementById("cartModal").style.display="none";}
function placeOrder(){
 if(!cart.length){alert("Cart empty hai.");return;}
 const name=document.getElementById("custName").value.trim(),phone=document.getElementById("custPhone").value.trim(),address=document.getElementById("custAddress").value.trim();
 if(!name||!phone||!address){alert("Please Name, Phone aur Address fill karo.");return;}
 alert("Order details ready hain. WhatsApp/payment connection next step mein add kiya ja sakta hai.");
}
render(products);updateCart();
</script>
</body>
</html>
