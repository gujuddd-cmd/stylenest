<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleNest - Fashion Store</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f6f6f6;color:#171717}
header{background:#111;color:#fff;padding:14px 18px;position:sticky;top:0;z-index:10}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:25px;font-weight:800}
.cart{background:#fff;color:#111;border:0;border-radius:22px;padding:10px 15px;font-weight:700}
.search{margin-top:12px;width:100%;padding:13px 15px;border:0;border-radius:12px;font-size:16px}
.hero{margin:18px;background:#111;color:#fff;border-radius:22px;padding:28px 24px}
.hero h1{font-size:30px;margin-bottom:10px}
.hero p{color:#ddd;margin-bottom:18px}
.btn{display:inline-block;background:#fff;color:#111;border:0;border-radius:12px;padding:12px 18px;font-weight:700}
section{padding:8px 18px 18px}
h2{font-size:22px;margin-bottom:14px}
.categories{display:flex;gap:10px;overflow:auto}
.cat{min-width:92px;background:#fff;border-radius:14px;padding:15px;text-align:center;box-shadow:0 2px 8px #ddd}
.cat span{display:block;font-size:28px;margin-bottom:6px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 8px #ddd}
.pic{width:100%;height:190px;object-fit:cover;background:#eee}
.info{padding:12px}
.name{font-weight:700;margin-bottom:7px}
.price{font-size:18px;font-weight:800}
.old{font-size:13px;color:#888;text-decoration:line-through;margin-left:6px}
.add{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:700}
footer{text-align:center;padding:25px 15px;color:#777;font-size:13px}
#cartBox{display:none;position:fixed;inset:0;background:#0008;z-index:20}
.cartPanel{position:absolute;bottom:0;background:#fff;width:100%;border-radius:20px 20px 0 0;padding:20px;max-height:80vh;overflow:auto}
.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px}
.cartItem{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ddd}
.total{font-size:20px;font-weight:800;margin:18px 0}
.order{width:100%;padding:14px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:800}
@media(min-width:700px){.products{grid-template-columns:repeat(4,1fr)}.hero{max-width:1100px;margin:18px auto}.products,section{max-width:1100px;margin:auto}}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="logo">StyleNest</div>
    <button class="cart" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button>
  </div>
  <input class="search" id="search" placeholder="Search clothes..." oninput="filterProducts()">
</header>

<div class="hero">
  <h1>Style that feels like you.</h1>
  <p>Fresh fashion for everyday style.</p>
  <button class="btn" onclick="document.getElementById('shop').scrollIntoView()">Shop Now →</button>
</div>

<section>
<h2>Categories</h2>
<div class="categories">
  <div class="cat">👕<span>Men</span></div>
  <div class="cat">👗<span>Women</span></div>
  <div class="cat">🧒<span>Kids</span></div>
  <div class="cat">🔥<span>New</span></div>
</div>
</section>

<section id="shop">
<h2>Trending Products</h2>
<div class="products" id="products"></div>
</section>

<div id="cartBox" onclick="if(event.target.id==='cartBox')closeCart()">
  <div class="cartPanel">
    <button class="close" onclick="closeCart()">✕</button>
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
    <div class="total">Total: ₹<span id="total">0</span></div>
    <button class="order" onclick="orderOnWhatsApp()">Place Order on WhatsApp</button>
    <p style="margin-top:10px;color:#777;font-size:12px">WhatsApp number will be connected in the next step.</p>
  </div>
</div>

<footer>© 2026 StyleNest • Fashion for everyone</footer>

<script>
const products=[
 {name:"Classic T-Shirt",price:499,old:699,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=700&q=80"},
 {name:"Oversized Hoodie",price:899,old:1199,img:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=700&q=80"},
 {name:"Denim Jacket",price:1299,old:1699,img:"https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=700&q=80"},
 {name:"Casual Dress",price:799,old:999,img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=700&q=80"},
 {name:"Street Shirt",price:699,old:899,img:"https://images.unsplash.com/photo-1603252110481-7ba873bf42ab?auto=format&fit=crop&w=700&q=80"},
 {name:"Summer Top",price:599,old:799,img:"https://images.unsplash.com/photo-1564257577054-8c4b5f3d0e9b?auto=format&fit=crop&w=700&q=80"},
 {name:"Cargo Pants",price:999,old:1299,img:"https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=700&q=80"},
 {name:"Classic Sneakers",price:1499,old:1899,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80"}
];
let cart=[];
function render(list=products){
 document.getElementById("products").innerHTML=list.map((p,i)=>`
 <div class="card">
  <img class="pic" src="${p.img}" alt="${p.name}">
  <div class="info">
   <div class="name">${p.name}</div>
   <div class="price">₹${p.price}<span class="old">₹${p.old}</span></div>
   <button class="add" onclick="addToCart(${products.indexOf(p)})">Add to Cart</button>
  </div>
 </div>`).join("");
}
function addToCart(i){cart.push(products[i]);document.getElementById("count").textContent=cart.length}
function openCart(){
 document.getElementById("cartBox").style.display="block";
 document.getElementById("cartItems").innerHTML=cart.length?cart.map((p,i)=>`<div class="cartItem"><span>${p.name}</span><b>₹${p.price}</b></div>`).join(""):"<p>Your cart is empty.</p>";
 document.getElementById("total").textContent=cart.reduce((s,p)=>s+p.price,0);
}
function closeCart(){document.getElementById("cartBox").style.display="none"}
function filterProducts(){
 const q=document.getElementById("search").value.toLowerCase();
 render(products.filter(p=>p.name.toLowerCase().includes(q)));
}
function orderOnWhatsApp(){alert("Next step: add your WhatsApp number, then customers can send orders directly to you.");}
render();
</script>
</body>
</html>
